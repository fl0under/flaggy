# Minimal monitoring helpers. Copy/symlink into ~/.tmux.conf or Exegol my-resources setup/tmux/tmux.conf.
set -g mouse on
set -g history-limit 50000
setw -g aggressive-resize on

# Prefix + B: show bbctl status for the current bb-* session name.
bind-key B display-popup -E "bash -lc 'SESSION=$(tmux display-message -p \"#{session_name}\"); if command -v bbctl >/dev/null 2>&1; then bbctl status $SESSION; else scripts/bbctl status $SESSION; fi; read -n1 -s -r -p Press_any_key'"

# Prefix + L: tail current pane into a popup.
bind-key L display-popup -E "tmux capture-pane -p -S -200; read -n1 -s -r -p Press_any_key"
