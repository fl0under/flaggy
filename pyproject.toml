[project]
name = "flaggy"
version = "0.1.0"
description = "Harbor-first scoped security-research eval task helper with optional interactive Pi/shell environments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
]

[project.optional-dependencies]
tui = ["textual>=0.70.0"]

[project.scripts]
flaggy = "bbagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bbagent"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.ruff]
line-length = 100
