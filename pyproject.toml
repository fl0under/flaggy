[project]
name = "bounty-pi-agent"
version = "0.1.0"
description = "Safety-gated, tmux/Docker-oriented Pi agent scaffold for legal bug bounty and vulnerability research workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
  "requests>=2.31.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
tui = ["textual>=0.70.0"]

[project.scripts]
bbctl = "bbagent.cli:main"

[tool.ruff]
line-length = 100
